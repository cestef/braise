{%extends "base.html"%}

{%block main%}

<div class="container px-4 py-16 mx-auto">
    <div class="flex flex-col items-center justify-center text-center">
        <img src="{{ get_url(path='/img/banner_light.gif') }}" alt="Braisé Logo" class="logo mb-6 dark:hidden">
        <img src="{{ get_url(path='/img/banner_dark.gif') }}" alt="Braisé Logo" class="logo mb-6 hidden dark:block">
        <h1 class="text-3xl sm:text-2xl md:text-4xl font-bold mb-4">Run your tasks like a chef!</h1>
        <div class="flex flex-col sm:flex-row gap-4 mt-8">
            <a href="{{ get_url(path='/docs/get-started') }}"
                class="bg-primary hover:bg-primary-hover text-primary-foreground font-bold py-3 px-6 rounded-lg transition-colors">
                Get Started
            </a>
            <a href="https://github.com/cestef/braise"
                class="border-2 border-primary text-primary hover:bg-primary hover:text-primary-foreground font-bold py-3 px-6 rounded-lg transition-colors">
                View on GitHub
            </a>
        </div>
    </div>
</div>

{%endblock%}
