[package]
name = "braise-cache"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
description = "Caching system for Braise task runner"
repository.workspace = true

[dependencies]
tracing.workspace = true

braise-types = { path = "../braise-types" }
braise-errors = { path = "../braise-errors" }

