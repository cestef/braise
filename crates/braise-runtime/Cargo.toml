[package]
name = "braise-runtime"
edition.workspace = true
version.workspace = true
authors.workspace = true

[dependencies]
num_cpus = "1.17.0"
rayon = "1.10.0"
once_cell = "1.21.3"
inquire = "0.7.5"
rand = "0.9.1"
glob = "0.3.2"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "rustls-tls-native-roots",
    "blocking",
] }
owo-colors.workspace = true
tracing.workspace = true

core = { path = "../braise-core", package = "braise-core" }
braise-types = { path = "../braise-types" }
parser = { path = "../braise-parser", package = "braise-parser" }
lexer = { path = "../braise-lexer", package = "braise-lexer" }

[dev-dependencies]
miette.workspace = true
braise-errors = { path = "../braise-errors" }
