[package]
name = "braise-runtime"
description = "Runtime (AST interpreter)"
edition.workspace = true
version.workspace = true
authors.workspace = true

[dependencies]
num_cpus = "1.17.0"
rayon = "1.10.0"
once_cell = "1.21.3"
inquire = "0.7.5"
rand = { version = "0.9.1", default-features = false, features = [
    "std",
    "std_rng",
    "thread_rng",
] }
glob = "0.3.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

owo-colors.workspace = true
log.workspace = true

core = { path = "../braise-core", package = "braise-core" }
braise-cache = { path = "../braise-cache" }

[dev-dependencies]
miette.workspace = true
braise-errors = { path = "../braise-errors" }
parser = { path = "../braise-parser", package = "braise-parser" }
lexer = { path = "../braise-lexer", package = "braise-lexer" }
