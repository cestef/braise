[package]
name = "braise-lsp"
edition.workspace = true
version.workspace = true
authors.workspace = true

[dependencies]
tower-lsp = "0.20.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ropey = "1"
url = "2.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
thiserror.workspace = true
miette.workspace = true

braise-core = { path = "../braise-core", package = "braise-core" }
lexer = { path = "../braise-lexer", package = "braise-lexer" }
parser = { path = "../braise-parser", package = "braise-parser" }
fmt = { path = "../braise-fmt", package = "braise-fmt" }
