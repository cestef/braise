[package]
name = "braise"
authors = ["cstef <hi@cstef.dev>"]
version = "0.2.3"
edition = "2021"
repository = "https://github.com/cestef/braise"
homepage = "https://github.com/cestef/braise"
description = "Run your tasks like a chef!"


[dependencies]
clap = { version = "4", features = ["cargo", "wrap_help", "string"] }
either = { version = "1", features = ["serde"] }
dirs = "6"
dotenvy = "0.15"
thiserror = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
regex = "1"
lazy_static = "1"
tokio = { version = "1", features = ["full"] }
const_format = "0.2.34"
paris-log = { version = "1.0.2", features = ["icons"] }
pretty_env_logger = "0.5.0"
log = "0.4.25"
cargo_toml = "0.21.0"
fnmatch-regex = "0.2.1"
async-recursion = "1.1.1"
color-eyre = "0.6.3"
strip-ansi-escapes = "0.2.1"
better-panic = "0.3.0"
human-panic = "2.0.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
